name: bale-bot
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bale-loop
  cancel-in-progress: true
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: multi-channel support bot (bale + telegram + rubika)
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          NGY_KEY: ${{ secrets.NGY_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SITE: https://negahbanyar.xo.je
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, threading, time, urllib.request, urllib.parse
          SITE = os.environ['SITE']; KEY = os.environ['NGY_KEY']
          NS = 1000000000000
          CH = {
              'bale':     {'tok': os.environ.get('BALE_TOKEN', ''),          'base': 'https://tapi.bale.ai/bot',     'ns': 0},
              'telegram': {'tok': os.environ.get('TELEGRAM_BOT_TOKEN', ''),  'base': 'https://api.telegram.org/bot', 'ns': NS},
              'rubika':   {'tok': os.environ.get('RUBIKA_BOT_TOKEN', ''),    'base': 'https://botapi.rubika.ir/v3/', 'ns': 2 * NS},
          }
          TEST = {'v': ''}
          def raw_req(req, t=45):
              with urllib.request.urlopen(req, timeout=t) as r:
                  return r.read().decode('utf-8', 'replace')
          def raw(u, t=45):
              h = {'User-Agent': 'okhttp/4.9.3'}
              if TEST['v']: h['Cookie'] = '__test=' + TEST['v']
              return raw_req(urllib.request.Request(u, headers=h), t)
          def solve(html):
              v = re.findall(r'toNumbers\("([0-9a-fA-F]+)"\)', html)
              if len(v) < 3: return ''
              p = subprocess.run(['openssl', 'enc', '-aes-128-cbc', '-d', '-K', v[0], '-iv', v[1], '-nopad'],
                                 input=bytes.fromhex(v[2]), capture_output=True)
              return p.stdout.hex()
          def srv(a, p=None):
              p = dict(p or {}); p['action'] = a; p['key'] = KEY
              u = SITE + '/bale/bot.php?' + urllib.parse.urlencode(p)
              for i in range(5):
                  try: body = raw(u)
                  except Exception:
                      time.sleep(1 + i); continue
                  if 'aes.js' in body:
                      v = solve(body)
                      if v: TEST['v'] = v
                      continue
                  if not body.strip():
                      time.sleep(1 + i); continue
                  try: return json.loads(body)
                  except Exception: time.sleep(1)
              return {'ok': False, 'err': 'srv unreachable'}
          def srv_post(a, p=None):
              p = dict(p or {})
              u = SITE + '/bale/bot.php?' + urllib.parse.urlencode({'action': a, 'key': KEY})
              data = urllib.parse.urlencode(p).encode()
              for i in range(5):
                  try:
                      h = {'User-Agent': 'okhttp/4.9.3', 'Content-Type': 'application/x-www-form-urlencoded'}
                      if TEST['v']: h['Cookie'] = '__test=' + TEST['v']
                      body = raw_req(urllib.request.Request(u, data=data, headers=h))
                  except Exception:
                      time.sleep(1 + i); continue
                  if 'aes.js' in body:
                      v = solve(body)
                      if v: TEST['v'] = v
                      continue
                  try: return json.loads(body)
                  except Exception: time.sleep(1)
              return {'ok': False, 'err': 'srv_post unreachable'}
          KB = ''
          try:
              _kb = srv('kb')
              if _kb.get('ok') and (_kb.get('content') or '').strip():
                  KB = _kb['content']
                  print('KB from panel/db:', len(KB), 'chars', flush=True)
          except Exception as e:
              print('KB server err:', e, flush=True)
          if not KB:
              try:
                  KB = open('knowledge/faq.md', encoding='utf-8').read()
                  print('KB from repo:', len(KB), 'chars', flush=True)
              except Exception as e:
                  print('KB load err:', e, flush=True)
          SYS = ("تو دستیار پشتیبانی «نگهبان‌یار» هستی — مجموعه‌ای سه‌اپی برای مدیریت ساختمان‌های مسکونی.\n"
                 "فقط و فقط بر اساس «دانش محصول» که در پیام کاربر می‌آید پاسخ بده.\n"
                 "اگر پاسخ در دانش محصول نبود، فقط کلمهٔ UNKNOWN را بنویس و هیچ توضیحی اضافه نکن.\n"
                 "قواعد: پاسخ کوتاه (حداکثر ۶ خط)، فارسی محاوره‌ای و محترمانه، ایموجی کم و به‌جا.\n"
                 "هرگز قیمت، تخفیف، شرط یا وعدهٔ زمانی که در دانش نیست از خودت نساز.\n"
                 "هرگز اطلاعات کاربران، ساکنان یا ساختمان‌ها را اعلام نکن.\n"
                 "کلمات ممنوع: «بدون سرور»، «گیت‌هاب»، «لایسنس»، «API» — به‌جایشان: «نصب ساده»، «گزارش خودکار»، «فعال‌سازی».\n"
                 "اگر کاربر درخواست کار خارج از پشتیبانی محصول داشت، بگو برای پیگیری با پشتیبانی انسانی تماس بگیرد.")
          def ai_answer(q):
              key = os.environ.get('GROQ_API_KEY', '')
              if not key or not KB: return ''
              body = json.dumps({
                  "model": "openai/gpt-oss-120b", "temperature": 0.2, "max_tokens": 600,
                  "messages": [{"role": "system", "content": SYS},
                               {"role": "user", "content": "### دانش محصول:\n" + KB + "\n\n### سؤال کاربر:\n" + q}]}).encode()
              req = urllib.request.Request('https://api.groq.com/openai/v1/chat/completions', data=body,
                                           headers={'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json',
                                                    'User-Agent': 'okhttp/4.9.3'})
              for i in range(2):
                  try:
                      with urllib.request.urlopen(req, timeout=25) as r: d = json.load(r)
                      t = ((d.get('choices') or [{}])[0].get('message') or {}).get('content', '').strip()
                      if not t or 'UNKNOWN' in t.upper(): return ''
                      return t[:3500]
                  except Exception as e:
                      print('ai err:', e, flush=True); time.sleep(2)
              return ''
          def meta_get(k):
              return (srv('meta', {'k': k}).get('value') or '')
          def meta_set(k, v):
              srv('meta', {'k': k, 'value': str(v)})
          def ch_api(name, method, params=None, t=40):
              ch = CH[name]
              if not ch['tok']: return {'ok': False, 'err': 'no token'}
              u = ch['base'] + ch['tok'] + '/' + method
              if name == 'rubika':
                  req = urllib.request.Request(u, data=json.dumps(params or {}).encode(),
                                               headers={'Content-Type': 'application/json'})
              else:
                  if params: u += '?' + urllib.parse.urlencode(params)
                  req = urllib.request.Request(u)
              for i in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=t) as r: return json.load(r)
                  except Exception as e:
                      if i == 2: return {'ok': False, 'err': str(e)}
                      time.sleep(1)
          def ch_ok(name, r):
              if not isinstance(r, dict): return False
              if name == 'rubika': return r.get('status') == 'OK'
              return bool(r.get('ok'))
          def parse_updates(name, ups):
              out = []
              for u in ups:
                  if name == 'rubika':
                      if u.get('type') != 'NewMessage': continue
                      nm = u.get('new_message') or {}
                      if (nm.get('sender_type') or '') != 'User': continue
                      c = u.get('chat_id'); t = nm.get('text')
                  else:
                      m = u.get('message') or {}
                      c = (m.get('chat') or {}).get('id'); t = m.get('text')
                  if c is not None and t: out.append((str(c), str(t)))
              return out
          def resolve_chat(name, ext):
              if name in ('bale', 'telegram'):
                  try: return CH[name]['ns'] + int(ext)
                  except Exception: return 0
              r = srv('chatmap', {'ch': name, 'ext': ext})
              return int(r.get('chat') or 0)
          def resolve_ext(name, chat):
              if name in ('bale', 'telegram'):
                  return str(int(chat) - CH[name]['ns'])
              r = srv('chatmap', {'chat': int(chat)})
              return (r.get('ext') or '') if r.get('ok') else ''
          def handle_updates(name, ups):
              sent = 0
              for ext, t in parse_updates(name, ups):
                  chat = resolve_chat(name, ext)
                  if not chat:
                      print(name, 'no chat for', ext[:24], flush=True); continue
                  r = srv('feed', {'chat': chat, 'text': t})
                  if not r.get('ok'):
                      print(name, 'FEED FAIL', json.dumps(r, ensure_ascii=False)[:150], flush=True); break
                  reply = (r.get('reply') or '').strip()
                  if not reply and r.get('ai'):
                      q = r.get('q') or t
                      reply = ai_answer(q)
                      ok = 1 if reply else 0
                      if not reply: reply = (r.get('fallback') or '').strip()
                      srv_post('ailog', {'chat': chat, 'q': q[:500], 'a': reply[:1500], 'ok': ok})
                      print(name, 'ai ok=' + str(ok), flush=True)
                  if reply:
                      rr = ch_api(name, 'sendMessage', {'chat_id': ext, 'text': reply[:4000]})
                      if ch_ok(name, rr): sent += 1
                      else: print(name, 'SEND FAIL', json.dumps(rr, ensure_ascii=False)[:150], flush=True)
              return sent
          def channel_loop(name):
              ch = CH[name]
              if not ch['tok']:
                  print(name, ': no token — skipped', flush=True); return
              off = None
              while True:
                  try:
                      if name == 'rubika':
                          if off is None: off = meta_get('offset_' + name) or None
                          up = ch_api(name, 'getUpdates', ({'offset_id': off, 'limit': 50} if off else {'limit': 50}), t=25)
                          data = up.get('data') or {}
                          ups = data.get('updates') or []
                          nxt = data.get('next_offset_id')
                      else:
                          if off is None:
                              off = int(meta_get('offset_' + name) or (meta_get('offset') if name == 'bale' else 0) or 0)
                          up = ch_api(name, 'getUpdates', {'offset': off, 'timeout': 25})
                          ups = up.get('result') or []
                          nxt = None
                      if ups:
                          sent = handle_updates(name, ups)
                          if name == 'rubika':
                              if nxt:
                                  off = nxt
                                  meta_set('offset_' + name, nxt)
                          else:
                              off = max(int(u.get('update_id', 0)) for u in ups) + 1
                              meta_set('offset_' + name, off)
                          print(name, 'updates=%d replied=%d' % (len(ups), sent), flush=True)
                  except Exception as e:
                      print(name, 'loop err:', e, flush=True); time.sleep(3)
                  time.sleep(2 if name == 'rubika' else 1)
          def outbox_loop():
              while True:
                  try:
                      ob = srv('outbox')
                      for o in (ob.get('items') or []):
                          chat = int(o['chat']); text = (o['text'] or '')[:4000]
                          for name, ch in CH.items():
                              if ch['tok'] and ch['ns'] <= chat < ch['ns'] + NS:
                                  ext = resolve_ext(name, chat)
                                  if not ext: break
                                  rr = ch_api(name, 'sendMessage', {'chat_id': ext, 'text': text})
                                  if ch_ok(name, rr):
                                      srv('sent', {'id': o['id']})
                                      print('outbox sent', o['id'], name, flush=True)
                                  break
                  except Exception as e:
                      print('outbox err:', e, flush=True)
                  time.sleep(10)
          def dl_backup(name):
              u = SITE + '/api/backup2.php?' + urllib.parse.urlencode({'action': 'dl', 'key': KEY, 'f': name})
              for i in range(3):
                  h = {'User-Agent': 'okhttp/4.9.3'}
                  if TEST['v']: h['Cookie'] = '__test=' + TEST['v']
                  try:
                      with urllib.request.urlopen(urllib.request.Request(u, headers=h), timeout=180) as r:
                          data = r.read()
                  except Exception as e:
                      print('bk dl err:', e, flush=True); time.sleep(2); continue
                  if b'aes.js' in data[:3000]:
                      v = solve(data.decode('utf-8', 'replace'))
                      if v: TEST['v'] = v
                      continue
                  return data
              return None
          def _mp(fields, files):
              b = '----ngy' + str(int(time.time() * 1000))
              out = b''
              for k, v in fields.items():
                  out += ('--' + b + '\r\nContent-Disposition: form-data; name="' + k + '"\r\n\r\n' + str(v) + '\r\n').encode()
              for k, fv in files.items():
                  fn, data = fv
                  out += ('--' + b + '\r\nContent-Disposition: form-data; name="' + k + '"; filename="' + fn + '"\r\nContent-Type: application/zip\r\n\r\n').encode() + data + b'\r\n'
              out += ('--' + b + '--\r\n').encode()
              return b, out
          def send_doc(ch, chat, data, fname):
              if ch in ('bale', 'telegram'):
                  b, body = _mp({'chat_id': chat, 'caption': '💾 پشتیبان روزانه نگهبان‌یار — ' + fname},
                                {'document': (fname, data)})
                  req = urllib.request.Request(CH[ch]['base'] + CH[ch]['tok'] + '/sendDocument', data=body,
                                               headers={'Content-Type': 'multipart/form-data; boundary=' + b})
                  try:
                      with urllib.request.urlopen(req, timeout=180) as r: return json.load(r)
                  except Exception as e: return {'ok': False, 'err': str(e)[:150]}
              if ch == 'rubika':
                  r1 = ch_api('rubika', 'requestSendFile', {'type': 'File'}, t=60)
                  up = ((r1.get('data') or {}).get('upload_url')) or ''
                  if not up: return {'ok': False, 'err': 'no upload_url'}
                  b, body = _mp({}, {'file': (fname, data)})
                  req = urllib.request.Request(up, data=body, headers={'Content-Type': 'multipart/form-data; boundary=' + b})
                  try:
                      with urllib.request.urlopen(req, timeout=180) as r: r2 = json.load(r)
                  except Exception as e: return {'ok': False, 'err': 'upload ' + str(e)[:120]}
                  fid = ((r2.get('data') or {}).get('file_id')) or r2.get('file_id') or ''
                  if not fid: return {'ok': False, 'err': 'no file_id'}
                  return ch_api('rubika', 'sendFile', {'chat_id': chat, 'file_id': fid, 'text': '💾 پشتیبان روزانه نگهبان‌یار'}, t=60)
              return {'ok': False, 'err': 'unknown channel'}
          def backup_loop():
              while True:
                  try:
                      c = srv2('cfg')
                      if c.get('ok') and str(c.get('enabled')) == '1':
                          t = time.gmtime(time.time() + 12600)
                          today = '%04d-%02d-%02d' % (t.tm_year, t.tm_mon, t.tm_mday)
                          hh = int(c.get('hour') or 12); mm = int(c.get('minute') or 0)
                          due = (t.tm_hour > hh) or (t.tm_hour == hh and t.tm_min >= mm)
                          if due and str(c.get('last_run') or '') != today:
                              print('backup: building...', flush=True)
                              r = srv2('build')
                              if not r.get('ok'):
                                  print('backup build failed:', json.dumps(r, ensure_ascii=False)[:200], flush=True)
                              else:
                                  name = r['name']; dests = []
                                  data = dl_backup(name)
                                  if data:
                                      for ch in ('bale', 'telegram', 'rubika'):
                                          if str(c.get('dest_' + ch)) != '1': continue
                                          chat = str(c.get('chat_' + ch) or '')
                                          if not chat: continue
                                          ext = resolve_ext(ch, int(chat)) if chat.isdigit() else chat
                                          if not ext: continue
                                          rr = send_doc(ch, ext, data, name)
                                          ok = ch_ok(ch, rr)
                                          dests.append(ch + ('✅' if ok else '❌'))
                                          if not ok: print('backup send fail', ch, json.dumps(rr, ensure_ascii=False)[:150], flush=True)
                                      if str(c.get('dest_email')) == '1' and c.get('email_to'):
                                          re_ = srv2('email', {'f': name, 'to': c['email_to']})
                                          dests.append('email' + ('✅' if re_.get('ok') else '❌'))
                                  srv2('mark', {'name': name, 'status': ('ارسال شد: ' + ' '.join(dests)) if dests else 'ساخته شد (بدون ارسال)'})
                                  print('backup done:', name, dests, flush=True)
                  except Exception as e:
                      print('backup err:', e, flush=True)
                  time.sleep(300)
          for n in CH:
              threading.Thread(target=channel_loop, args=(n,), daemon=True).start()
          threading.Thread(target=outbox_loop, daemon=True).start()
          threading.Thread(target=backup_loop, daemon=True).start()
          while True:
              time.sleep(60)
          PY
